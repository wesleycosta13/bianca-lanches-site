name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Start Application Services (Docker Compose)
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          : "${POSTGRES_USER:?GitHub Actions secret POSTGRES_USER is missing or unavailable to this workflow}"
          : "${POSTGRES_PASSWORD:?GitHub Actions secret POSTGRES_PASSWORD is missing or unavailable to this workflow}"
          : "${POSTGRES_DB:?GitHub Actions secret POSTGRES_DB is missing or unavailable to this workflow}"
          : "${JWT_SECRET:?GitHub Actions secret JWT_SECRET is missing or unavailable to this workflow}"
          : "${ADMIN_EMAIL:?GitHub Actions secret ADMIN_EMAIL is missing or unavailable to this workflow}"
          : "${ADMIN_PASSWORD:?GitHub Actions secret ADMIN_PASSWORD is missing or unavailable to this workflow}"

          printf '%s\n' \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "POSTGRES_DB=$POSTGRES_DB" \
            "Jwt__Secret=$JWT_SECRET" \
            "Admin__Email=$ADMIN_EMAIL" \
            "Admin__Password=$ADMIN_PASSWORD" > .env
          docker compose up -d --build
          echo "Aguardando API ficar disponível..."
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/products > /dev/null; then
              echo "API disponível."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 api postgres
          echo "A API não ficou disponível dentro do tempo limite."
          exit 1

      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright Tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          API_BASE_URL: http://localhost:8080/api
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CI: true
        run: npm test

      - name: Collect Docker Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 api postgres frontend

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Failure Artifacts (Screenshots, Videos, Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: e2e/test-results/
          retention-days: 14
