name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Start Application Services (Docker Compose)
        run: |
          docker compose up -d --build
          echo "Aguardando serviços subirem..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Aplicação disponível no porto 8080!"
              break
            fi
            sleep 2
          done

      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          ADMIN_EMAIL: admin123456@gmail.com
          ADMIN_PASSWORD: admin12345678
          CI: true
        run: npm test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Failure Artifacts (Screenshots, Videos, Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: e2e/test-results/
          retention-days: 14
