services:
  postgres:
    image: postgres:16-alpine
    container_name: salgados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - salgados_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/Salgados.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_HOST_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/admin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      - api

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    container_name: salgados-e2e
    profiles:
      - e2e
      - test
    env_file:
      - path: .env
        required: false
    environment:
      BASE_URL: http://frontend:8080
      API_BASE_URL: http://frontend:8080/api
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${Admin__Email:-}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${Admin__Password:-}}
      CI: "true"
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    volumes:
      - ./e2e/playwright-report:/app/e2e/playwright-report
      - ./e2e/test-results:/app/e2e/test-results

volumes:
  salgados_pgdata:
